apiVersion: v1
kind: ConfigMap
metadata:
  name: task-config
  namespace: task-manager
data:
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "taskdb"
  MYSQL_USER: "taskuser"
---
# Same content as mysql/init.sql, mounted into MySQL's init directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: task-manager
data:
  init.sql: |
    USE taskdb;

    CREATE TABLE IF NOT EXISTS tasks (
        id INT AUTO_INCREMENT PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        description TEXT,
        completed BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO tasks (title, description)
    VALUES
    ('Learn Docker', 'Practice Docker containers'),
    ('Learn Kubernetes', 'Practice Pods and Deployments'),
    ('Learn PV and PVC', 'Practice Kubernetes persistent storage');
