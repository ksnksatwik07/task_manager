# Rendered by the official nginx image at startup (envsubst on /etc/nginx/templates/*.template).
# BACKEND_HOST is "backend" in Docker Compose and "task-backend" in Kubernetes.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
